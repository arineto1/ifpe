    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #080c14;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        /* Ambient Glow Highlights */
        .glow-1 {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .glow-2 {
            position: absolute;
            bottom: 10%;
            right: 20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        /* Duolingo-style Tactile 3D Pushable Buttons */
        .duo-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            font-weight: 700;
            transition: all 0.12s ease-in-out;
            user-select: none;
            text-decoration: none;
            box-shadow: 0 5px 0 var(--btn-border);
            background: var(--btn-bg);
            border: 1px solid var(--btn-stroke);
            color: #ffffff;
        }

        .duo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 var(--btn-border);
            filter: brightness(1.1);
        }

        .duo-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--btn-border);
        }

        /* Amber Color Variant */
        .btn-amber {
            --btn-bg: #1e170d;
            --btn-stroke: #453014;
            --btn-border: #b45309;
        }
    </style>
</head>
